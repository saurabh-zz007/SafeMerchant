[project]
name = "safemerchant-backend"
version = "0.1.0"
description = "Autonomous AI Risk Manager — Defense-only chargeback agent for Razorpay Buildathon"
requires-python = ">=3.11"
dependencies = [
    # ── Web Framework ──
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",

    # ── Database (Async PostgreSQL) ──
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",

    # ── Agent Orchestration ──
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",

    # ── Config & Utilities ──
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",

    # ── PDF Generation ──
    "reportlab>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
